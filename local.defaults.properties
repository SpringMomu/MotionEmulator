# Optional upstream services are disabled in fork builds by default.
# A space is blank to Kotlin; Secrets 2.0.1 emits invalid Java for an empty quoted value.
server_uri=" "
product="motion-emulator"
# Supply your own map keys in the ignored local.properties for a usable manager APK.
amap.web.key="UNCONFIGURED"
AMAP_SDK_KEY="UNCONFIGURED"
GCP_MAPS_KEY="UNCONFIGURED"
